
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Controle de Estoque</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="{% url 'produtos:home' %}">
            Controle de Estoque
        </a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light">
                Sair
            </button>
        </form>
    </div>
</nav>

<main class="container py-5">
    <div class="text-center mb-5">
        <h1>Bem-vindo ao Controle de Estoque</h1>
        <p class="text-muted">
            Gerencie seus produtos de maneira simples e organizada.
        </p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <h3>Cadastrar produto</h3>
                    <p>Adicione novos produtos ao seu estoque.</p>

                    <a
                        href="{% url 'produtos:cadastrar' %}"
                        class="btn btn-success"
                    >
                        Novo produto
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <h3>Meus produtos</h3>
                    <p>Consulte, edite e exclua seus produtos.</p>

                    <a
                        href="{% url 'produtos:lista' %}"
                        class="btn btn-primary"
                    >
                        Ver produtos
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow-sm mt-5">
        <div class="card-body">
            <h4>Pesquisar produtos</h4>

            <form method="get" action="{% url 'produtos:lista' %}">
                <div class="input-group">
                    <input
                        type="search"
                        name="q"
                        class="form-control"
                        placeholder="Digite o nome, a categoria ou a descrição..."
                    >

                    <button type="submit" class="btn btn-success">
                        Pesquisar
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
