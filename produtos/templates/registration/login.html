
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Controle de Estoque</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm p-4 w-100" style="max-width: 420px;">
        <h1 class="h3 text-center mb-2">Controle de Estoque</h1>
        <p class="text-muted text-center mb-4">Entre na sua conta</p>

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuário ou senha inválidos. Tente novamente.
            </div>
        {% endif %}

        {% if next %}
            {% if user.is_authenticated %}
                <div class="alert alert-warning">
                    Sua conta não tem permissão para acessar essa página.
                </div>
            {% endif %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Senha</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>
    </div>
</div>

</body>
</html>
